# 首次进入服务器验证码验证设置
verification:
  # 固定数字验证码。请使用引号，避免前导 0 被 YAML 当作数字处理。
  code: "123456"
  # 连续输错多少次后踢出玩家。0 表示不限制。
  max-attempts: 5
  kick-on-max-attempts: true
  # Java 玩家提示间隔；基岩版表单关闭后也会在此间隔后重新弹出。
  prompt-interval-seconds: 10

freeze:
  block-interactions: true
  block-inventory: true
  block-damage: true
  block-item-pickup: true

messages:
  prefix: "&8[&b首次验证&8] &r"

  # Java 版聊天栏提示。
  prompt-java: "&e请在聊天栏输入服务器提供的数字验证码。"

  # 基岩版表单标题、输入框和占位提示。
  bedrock-form-title: "首次进入验证"
  bedrock-form-label: "请输入服务器提供的数字验证码"
  bedrock-form-placeholder: "在此输入数字"

  # 当表单 API 不可用时的回退提示。
  prompt-bedrock-fallback: "&e无法打开验证窗口，请在聊天栏输入数字验证码。"
  form-closed: "&e你尚未完成验证。验证窗口稍后会再次打开。"

  already-verified: "&a你已经完成验证，可以正常游玩了。"
  invalid-input: "&c请输入纯数字验证码。"
  incorrect: "&c验证码错误，请重新输入。"
  remaining-attempts: "&e剩余尝试次数：&c{remaining}"
  success: "&a验证成功！现在可以正常游玩了。"
  # 验证成功时显示的标题和副标题。
  title-success: "&a验证成功"
  title-success-subtitle: "&f欢迎来到服务器！"
  # 玩家首次进入时显示的标题和副标题。
  title-join: "&6首次进入验证"
  title-join-subtitle: "&f请输入数字验证码"
  save-error: "&c验证状态保存失败，请联系管理员。"
  kick-limit: "&c验证码错误次数过多，请重新进入服务器后再试。"
  command-usage: "&e用法：/verifyadmin reload"

  admin-reloaded: "&a配置文件已重新加载。"
  admin-no-permission: "&c你没有权限执行此命令。"
  admin-invalid-config: "&c配置无效：verification.code 必须是非空数字字符串。"
