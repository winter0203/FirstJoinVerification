name: Build and release plugin

on:
  push:
    branches: [main]
    tags:
      - '*'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并上传到哪个已有 Release（例如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::必须填写 Release Tag，例如 1.0.0"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Build plugin
        run: gradle clean build --no-daemon

      - name: Verify plugin JAR
        shell: bash
        run: |
          JAR="build/libs/FirstJoinVerification-1.0.0.jar"
          if [ ! -s "$JAR" ]; then
            echo "::error::构建产物不存在或为空：$JAR"
            echo "build/libs 当前文件："
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          ls -lh "$JAR"

      - name: Upload plugin JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FirstJoinVerification-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          path: build/libs/FirstJoinVerification-1.0.0.jar
          if-no-files-found: error
          retention-days: 90

      - name: Publish or update GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          name: FirstJoinVerification ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: build/libs/FirstJoinVerification-1.0.0.jar
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag || github.event.release.tag_name || github.ref_name, '-') }}
